name: Keep CuraTwin Backend Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render free tier 15-minute inactivity sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep_alive:
    name: Ping Render Health Endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Backend Health
        run: |
          echo "Pinging CuraTwin backend health endpoint..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://curatwin-backend.onrender.com/health)
          echo "Backend responded with HTTP status $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "CuraTwin backend is online and healthy!"
          else
            echo "Warning: Response status was $HTTP_STATUS"
          fi
